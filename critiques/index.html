<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Critique - Pronucleaire</title>
    <!-- Link your actual site's pure CSS stylesheet here -->
    <link rel="stylesheet" href="../style.css"> 
    
    <!-- Marked.js for parsing Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- Header / Nav matching the rest of your site -->
    <header>
        <nav>
            <a href="/">← Back to Home</a>
        </nav>
    </header>

    <!-- Main Content Wrapper (matches your site's styling) -->
    <main class="container" style="max-width: 800px; margin: 0 auto; padding: 2rem;">
        <div id="content">
            <p>Loading critique...</p>
        </div>
    </main>

    <!-- Footer matching your site -->
    <footer>
        <p>&copy; Pronucleaire</p>
    </footer>

    <script>
        async function loadMarkdownPage() {
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            // pathSegments will look like ['critiques', 'my-file']
            const pageName = pathSegments[pathSegments.length - 1];

            // If they just hit /critiques/ or /critiques/index.html, show a directory or fallback
            if (!pageName || pageName === 'critiques') {
                document.getElementById('content').innerHTML = '<h1>Critiques</h1><p>Please select a valid critique.</p>';
                return;
            }

            // Construct the path to the actual raw .md file
            const mdUrl = `./${pageName}.md`;

            try {
                const response = await fetch(mdUrl);
                if (!response.ok) throw new Error('Critique not found');
                
                const markdownText = await response.text();
                
                // Convert Markdown to HTML using marked.js
                const parsedHTML = marked.parse(markdownText);
                
                // Inject into the page wrapper
                document.getElementById('content').innerHTML = parsedHTML;

                // Optional: Dynamically update the browser tab title using the first H1 tag found
                const firstHeading = document.querySelector('#content h1');
                if (firstHeading) {
                    document.title = firstHeading.innerText + " - Pronucleaire";
                }

            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <h1>404 - Not Found</h1>
                    <p>Sorry, the critique "${pageName}" could not be found.</p>
                `;
            }
        }

        loadMarkdownPage();
    </script>
</body>
</html>
